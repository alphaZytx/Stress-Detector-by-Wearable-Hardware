[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-detection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    # The bundled joblib models were fitted with scikit-learn 1.6.1. Keep the
    # serving runtime on the matching minor release (joblib is not forward ABI).
    "scikit-learn>=1.6,<1.7",
    # Base model for the ensemble. 3.0.x is the current line and works with
    # Python 3.11 and the scikit-learn pin above (XGBClassifier only needs the
    # sklearn estimator API, not its internals). Capped below 3.1 so a future
    # major cannot silently change tree-building defaults under the committed
    # artifacts. macOS also needs the OpenMP runtime: `brew install libomp`.
    "xgboost>=2.0,<3.1",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "pytest>=8.0",
    "kagglehub>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "pyserial>=3.5",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "passlib[bcrypt]>=1.7",
    # bcrypt is pinned <5: passlib 1.7.4's backend-detection probe trips
    # bcrypt 5.x's hard 72-byte password limit and crashes on import/use.
    "bcrypt<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
