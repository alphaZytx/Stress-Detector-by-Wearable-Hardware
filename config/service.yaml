service:
  host: 127.0.0.1
  port: 8010
  log_level: INFO

input:
  # Main dashboard now consumes the physical NodeMCU serial stream by default.
  source: serial             # synthetic | csv_replay | serial | tcp
  synthetic:
    speed: 2.0               # Gentle demo pace; real hardware streams at 1 Hz
    seed: 42                 # reproducible random stream; change for a new run
    baseline_s: 60
    stress_s: 60
    recovery_s: 60
  csv_replay:
    files:
      - data/raw/revised_sensors_baseline__1_.csv
      - data/raw/revised_sensors_stress__1_.csv
    loop: true
    speed: 1.0               # 1.0 = realtime, 10.0 = 10x faster (raise for e2e)
  serial:
    # ESP32 over USB. On macOS the port is typically /dev/tty.usbserial-XXXX or
    # /dev/tty.SLAB_USBtoUART - run `ls /dev/tty.*` with the device plugged in.
    # To use real hardware: set input.source above to `serial` and the port here.
    port: /dev/cu.usbserial-A5069RR4
    baudrate: 115200
  tcp:
    host: 0.0.0.0
    port: 9000

inference:
  # Which classifier to serve. Switching models is a config change, never a
  # code change. Supported: svm | random_forest | xgboost | mlp | soft_voting |
  # stacking | personalized_extra_trees.
  #   svm      - the Phase 1 baseline, always available
  #   stacking - the proposed ensemble (4 base models → LogisticRegression)
  # See reports/ensemble_report.md for the LOSO comparison behind this choice.
  model_type: personalized_extra_trees

  # Final model: 120-second personal resting calibration followed by relative
  # HR/GSR/temperature features and Extra Trees. The artifact contains the
  # previous soft-voting model as its automatic no-calibration fallback.
  model_path: data/models/personalized_extra_trees_wesad_v*.joblib

  # Startup fallback used only if the personalized artifact is absent.
  fallback_model_path: data/models/ensemble_soft_wesad_hardware_v2.joblib

  smoothing:
    method: ema              # ema | majority
    window: 6                # last 6 predictions (= 30s at 5s stride)
    ema_alpha: 0.2           # Lower alpha reduces rapid baseline/stress flips

session:
  db_path: data/sessions.sqlite
  export_dir: reports/sessions
